name: Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build and push Docker image
      run: |
        docker build -f backend/Dockerfile -t my-fullstack-app .

    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          cd /root/sites/iitmquizzes
          git pull
          docker stop my-fullstack-app || true
          docker rm my-fullstack-app || true
          docker build -f backend/Dockerfile -t my-fullstack-app .
          # Option 1: Use environment variable (recommended)
          docker run -d --name my-fullstack-app -p 3002:5000 -e OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" my-fullstack-app
          
          # Option 2: Create .env file on VM (alternative)
          # echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" > backend/.env
          # docker run -d --name my-fullstack-app -p 3002:5000 -v $(pwd)/backend/.env:/app/.env my-fullstack-app