name: Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build and push Docker image
      run: |
        docker build -f backend/Dockerfile -t my-fullstack-app .

    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          cd /root/sites/iitmquizzes
          git pull
          docker stop my-fullstack-app || true
          docker rm my-fullstack-app || true
          docker build -f backend/Dockerfile -t my-fullstack-app .
          docker run -d --name my-fullstack-app -p 3002:5000 my-fullstack-app